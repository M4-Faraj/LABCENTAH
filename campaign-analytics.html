<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Campaign Analytics — E Marketing Lab co.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{
            --c-ink:#150430;--c-purple:#7C3AED;--c-purple-mid:#9B59F5;
            --c-lavender:#EDE9F8;--c-lavender-2:#F4F1FC;
            --c-orange:#FF5E1A;--c-orange-2:#E84D0A;
            --c-muted:#B8A8D4;--c-border:#DDD6F0;--c-white:#FFFFFF;
            --f-display:'Plus Jakarta Sans',sans-serif;--f-body:'Inter',sans-serif;
            --radius-sm:6px;--radius-md:12px;--radius-lg:20px;--radius-xl:32px;
            --transition:0.22s cubic-bezier(.4,0,.2,1);
        }
        body{font-family:var(--f-body);background:var(--c-ink);color:#fff;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}

        /* background */
        .bg-canvas{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#0e0120 0%,#1a0438 45%,#150430 75%,#0a0118 100%);}
        .bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(124,58,237,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,0.07) 1px,transparent 1px);background-size:56px 56px;}
        .bg-orb{position:absolute;border-radius:50%;filter:blur(90px);}
        .orb1{width:550px;height:550px;top:-180px;left:-130px;background:#7C3AED;opacity:0.3;animation:drift1 14s ease-in-out infinite;}
        .orb2{width:380px;height:380px;bottom:-80px;right:-80px;background:#FF5E1A;opacity:0.15;animation:drift2 18s ease-in-out infinite;}
        .orb3{width:260px;height:260px;top:45%;left:58%;background:#9B59F5;opacity:0.18;animation:drift3 11s ease-in-out infinite;}
        @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(35px,25px) scale(1.04)}}
        @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-25px,-18px)}}
        @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-25px)}}

        .page{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:32px 24px 64px;}

        /* header */
        .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:14px;}
        .logo-area{display:flex;align-items:center;gap:12px;}
        .logo-area img{height:34px;width:auto;object-fit:contain;}
        .logo-divider{width:1px;height:26px;background:rgba(255,255,255,0.15);margin:0 4px;}
        .header-title{font-family:var(--f-display);font-size:15px;font-weight:700;color:#fff;}
        .header-sub{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;}
        .badge-ai{display:inline-flex;align-items:center;gap:7px;background:rgba(124,58,237,0.22);border:1px solid rgba(124,58,237,0.38);color:#c4b0ff;font-size:12px;font-weight:500;padding:6px 14px;border-radius:20px;backdrop-filter:blur(8px);}
        .badge-dot{width:6px;height:6px;border-radius:50%;background:#9B59F5;animation:pulse 2s infinite;}
        @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(155,89,245,0.5)}50%{opacity:0.6;box-shadow:0 0 0 5px rgba(155,89,245,0)}}

        /* form card */
        .form-card{background:rgba(255,255,255,0.055);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-xl);padding:26px 26px 22px;margin-bottom:18px;backdrop-filter:blur(14px);}
        .form-section-label{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:rgba(255,255,255,0.32);margin-bottom:16px;}
        .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:13px;}
        .field label{display:block;font-size:12px;font-weight:500;color:rgba(255,255,255,0.48);margin-bottom:5px;}
        .field input,.field select{width:100%;padding:10px 13px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.11);border-radius:var(--radius-md);font-family:var(--f-body);font-size:14px;color:#fff;outline:none;transition:border-color var(--transition),background var(--transition);}
        .field input::placeholder{color:rgba(255,255,255,0.22);}
        .field input:focus,.field select:focus{border-color:rgba(124,58,237,0.65);background:rgba(124,58,237,0.1);}
        .field select option{background:#1a0438;color:#fff;}

        .btn-analyze{margin-top:18px;padding:12px 26px;background:linear-gradient(135deg,#7C3AED,#9B59F5);color:#fff;border:none;border-radius:var(--radius-md);font-family:var(--f-display);font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform var(--transition),box-shadow var(--transition),opacity var(--transition);box-shadow:0 4px 18px rgba(124,58,237,0.38);}
        .btn-analyze:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(124,58,237,0.5);}
        .btn-analyze:active{transform:scale(0.98);}
        .btn-analyze:disabled{opacity:0.45;cursor:not-allowed;transform:none;box-shadow:none;}
        .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,0.28);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:none;}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* metrics */
        .metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:11px;margin-bottom:18px;}
        .metric-card{background:rgba(255,255,255,0.055);border:1px solid rgba(255,255,255,0.09);border-radius:var(--radius-lg);padding:15px 17px;backdrop-filter:blur(10px);transition:transform var(--transition),border-color var(--transition);}
        .metric-card:hover{transform:translateY(-2px);border-color:rgba(124,58,237,0.32);}
        .metric-card.forecast{border-color:rgba(124,58,237,0.28);background:rgba(124,58,237,0.1);}
        .metric-label{font-size:11px;color:rgba(255,255,255,0.42);margin-bottom:7px;font-weight:500;}
        .metric-value{font-size:21px;font-weight:700;font-family:var(--f-display);color:#fff;}
        .metric-delta{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:3px;font-weight:500;}
        .up{color:#6ee7b7;}.down{color:#fca5a5;}

        /* bottom grid */
        .bottom-grid{display:grid;grid-template-columns:1fr 310px;gap:14px;}
        @media(max-width:680px){.bottom-grid{grid-template-columns:1fr;}}
        .chart-card,.insights-card{background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:var(--radius-xl);padding:20px 22px;backdrop-filter:blur(14px);}
        .card-label{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:rgba(255,255,255,0.32);margin-bottom:14px;}
        .legend{display:flex;gap:14px;margin-bottom:12px;}
        .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,0.4);}
        .legend-line{width:18px;height:2px;border-radius:1px;}

        /* insights */
        .insight-item{padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
        .insight-item:last-child{border-bottom:none;padding-bottom:0;}
        .insight-tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;margin-bottom:6px;}
        .tag-opportunity{background:rgba(110,231,183,0.14);color:#6ee7b7;}
        .tag-warning{background:rgba(255,94,26,0.15);color:#ff9060;}
        .tag-forecast{background:rgba(124,58,237,0.24);color:#c4b0ff;}
        .insight-text{font-size:13px;line-height:1.58;color:rgba(255,255,255,0.72);}

        /* empty */
        .empty-state{background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.1);border-radius:var(--radius-xl);padding:52px 24px;text-align:center;color:rgba(255,255,255,0.28);margin-top:6px;}
        .empty-icon{font-size:34px;margin-bottom:10px;opacity:0.45;}
        .empty-text{font-size:14px;line-height:1.6;}

        .hidden{display:none!important;}
        .fade-in{animation:fadeUp 0.38s ease both;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    </style>
</head>
<body>

<div class="bg-canvas">
    <div class="bg-grid"></div>
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>
</div>

<div class="page">

    <div class="header">
        <div class="logo-area">
            <img src="images/logo.png" alt="E Marketing Lab co." onerror="this.style.display='none'"/>
            <div class="logo-divider"></div>
            <div>
                <div>
                    <div class="header-title">
                        <img src="images/logo.png" alt="logo" style="height:28px; vertical-align:middle; margin-right:8px;" onerror="this.style.display='none'"/>
                        Campaign Analytics
                    </div>
                    <div class="header-sub">E Marketing Lab co.</div>
                </div>
            </div>
        </div>
        <div class="badge-ai"><span class="badge-dot"></span>AI forecast · next 30 days</div>
    </div>

    <div class="form-card">
        <div class="form-section-label">Enter your campaign data</div>
        <div class="form-grid">
            <div class="field">
                <label>Service type</label>
                <select id="inp-service">
                    <option value="Media Buying">Media Buying & Performance Ads</option>
                    <option value="Digital Marketing">Digital Marketing & Strategy</option>
                    <option value="SEO">SEO & Organic Growth</option>
                    <option value="Content Marketing">Content Marketing & Creation</option>
                    <option value="Creative Design">Creative Design & Animation</option>
                    <option value="Web">Web & Digital Solutions</option>
                    <option value="Training">Training & Capacity Building</option>
                    <option value="CRM">CRM & Growth Infrastructure</option>
                    <option value="Gamified">Gamified Marketing Campaigns</option>
                    <option value="Strategy">Future-Proof Strategy</option>
                </select>
            </div>
            <div class="field"><label>Monthly budget ($)</label><input type="number" id="inp-budget" placeholder="e.g. 500" min="0"/></div>
            <div class="field"><label>Monthly reach</label><input type="number" id="inp-reach" placeholder="e.g. 12000" min="0"/></div>
            <div class="field"><label>Leads / month</label><input type="number" id="inp-leads" placeholder="e.g. 45" min="0"/></div>
            <div class="field"><label>Conversions / month</label><input type="number" id="inp-conv" placeholder="e.g. 8" min="0"/></div>
            <div class="field"><label>Avg. deal value ($)</label><input type="number" id="inp-deal" placeholder="e.g. 200" min="0"/></div>
        </div>
        <button class="btn-analyze" id="analyze-btn" onclick="runAnalysis()">
            <span id="btn-spinner" class="spinner"></span>
            <span id="btn-text">Analyze & forecast →</span>
        </button>
    </div>

    <div id="metrics-section" class="hidden">
        <div class="metrics-grid fade-in" id="metrics-grid"></div>
        <div class="bottom-grid fade-in">
            <div class="chart-card">
                <div class="card-label">30-day performance forecast</div>
                <div class="legend">
                    <div class="legend-item"><div class="legend-line" style="background:repeating-linear-gradient(90deg,rgba(255,255,255,0.28) 0,rgba(255,255,255,0.28) 4px,transparent 4px,transparent 7px);"></div>Current trend</div>
                    <div class="legend-item"><div class="legend-line" style="background:#9B59F5;"></div>AI forecast</div>
                </div>
                <div style="position:relative;height:210px;">
                    <canvas id="forecastChart" role="img" aria-label="Line chart comparing current trend vs AI forecast for 30 days">Campaign performance forecast data.</canvas>
                </div>
            </div>
            <div class="insights-card">
                <div class="card-label">AI insights</div>
                <div id="insights-body"></div>
            </div>
        </div>
    </div>

    <div id="empty-section">
        <div class="empty-state">
            <div class="empty-icon">📊</div>
            <div class="empty-text">Enter your campaign numbers above<br/>and let AI forecast the next 30 days</div>
        </div>
    </div>

</div>

<!-- local-config.js is gitignored; only present on the developer's machine.
     When missing, AI_ENABLED becomes false and the page uses fallback forecasts. -->
<script src="local-config.js" onerror="window.AI_OFFLINE=true"></script>
<script>
    const AI_ENABLED = typeof GROQ_API_KEY === 'string' && GROQ_API_KEY.length > 10;
    let chartInstance=null;
    function v(id){return parseFloat(document.getElementById(id).value)||0;}

    function buildMetrics(d){
        const budget=v('inp-budget'),reach=v('inp-reach'),leads=v('inp-leads'),conv=v('inp-conv'),deal=v('inp-deal');
        const roas=budget>0?((conv*deal)/budget).toFixed(1):'—';
        const cpl=leads>0?Math.round(budget/leads):'—';
        const fr=d.forecastedReach||Math.round(reach*1.22);
        const fl=d.forecastedLeads||Math.round(leads*1.18);
        const froas=d.forecastedROAS||(parseFloat(roas)+0.4).toFixed(1);
        return[
            {label:'Current reach',value:reach.toLocaleString(),delta:null,forecast:false},
            {label:'Forecasted reach',value:fr.toLocaleString(),delta:reach>0?'+'+Math.round((fr-reach)/reach*100)+'%':null,up:true,forecast:true},
            {label:'Current leads',value:leads,delta:null,forecast:false},
            {label:'Forecasted leads',value:fl,delta:leads>0?'+'+Math.round((fl-leads)/leads*100)+'%':null,up:true,forecast:true},
            {label:'Current ROAS',value:roas+'×',delta:null,forecast:false},
            {label:'Forecasted ROAS',value:froas+'×',delta:'+'+(froas-roas>0?(froas-roas).toFixed(1):'0')+'×',up:true,forecast:true},
            {label:'Cost per lead',value:cpl==='—'?'—':'$'+cpl,delta:null,forecast:false},
        ];
    }

    function renderMetrics(metrics){
        document.getElementById('metrics-grid').innerHTML=metrics.map(m=>`
    <div class="metric-card${m.forecast?' forecast':''}">
      <div class="metric-label">${m.label}</div>
      <div class="metric-value">${m.value}</div>
      ${m.delta?`<div class="metric-delta ${m.up?'up':'down'}">${m.up?'↑':'↓'} ${m.delta}</div>`:'<div style="height:17px;"></div>'}
    </div>`).join('');
    }

    function renderChart(d){
        const leads=v('inp-leads');
        const labels=['Day 1','Day 5','Day 10','Day 15','Day 20','Day 25','Day 30'];
        const gr=d.growthRate||0.18;
        const curr=labels.map((_,i)=>Math.round(leads+(leads*0.04*i/6)));
        const fore=labels.map((_,i)=>Math.round(leads+(leads*gr*i/6)));
        if(chartInstance)chartInstance.destroy();
        chartInstance=new Chart(document.getElementById('forecastChart'),{
            type:'line',
            data:{labels,datasets:[
                    {label:'Current',data:curr,borderColor:'rgba(255,255,255,0.22)',borderWidth:1.5,borderDash:[5,4],pointRadius:0,tension:0.4,fill:false},
                    {label:'Forecast',data:fore,borderColor:'#9B59F5',backgroundColor:'rgba(124,58,237,0.1)',borderWidth:2.5,pointRadius:4,pointBackgroundColor:'#9B59F5',pointBorderColor:'transparent',tension:0.4,fill:true}
                ]},
            options:{
                responsive:true,maintainAspectRatio:false,
                plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(21,4,48,0.92)',titleColor:'#fff',bodyColor:'rgba(255,255,255,0.65)',borderColor:'rgba(124,58,237,0.35)',borderWidth:1}},
                scales:{
                    x:{ticks:{font:{size:11,family:'Inter'},color:'rgba(255,255,255,0.32)'},grid:{display:false},border:{display:false}},
                    y:{ticks:{font:{size:11,family:'Inter'},color:'rgba(255,255,255,0.32)'},grid:{color:'rgba(255,255,255,0.045)'},border:{display:false}}
                }
            }
        });
    }

    function renderInsights(insights){
        const tags={opportunity:'tag-opportunity',warning:'tag-warning',forecast:'tag-forecast'};
        document.getElementById('insights-body').innerHTML=insights.map(i=>`
    <div class="insight-item">
      <span class="insight-tag ${tags[i.type]||'tag-forecast'}">${i.type}</span>
      <div class="insight-text">${i.text}</div>
    </div>`).join('');
    }

    async function callAI(prompt){
        if(!AI_ENABLED) return null;
        try{
            const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
                method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${GROQ_API_KEY}`},
                body:JSON.stringify({model:'llama-3.1-8b-instant',max_tokens:600,messages:[
                        {role:'system',content:'You are a digital marketing analyst for E Marketing Lab co. Return ONLY valid JSON, no markdown, no explanation.'},
                        {role:'user',content:prompt}
                    ]})
            });
            const json=await res.json();
            return JSON.parse(json.choices[0].message.content.replace(/```json|```/g,'').trim());
        }catch(e){return null;}
    }

    async function runAnalysis(){
        const budget=v('inp-budget'),reach=v('inp-reach'),leads=v('inp-leads'),conv=v('inp-conv'),deal=v('inp-deal');
        const service=document.getElementById('inp-service').value;
        if(!budget&&!reach&&!leads){alert('Please enter at least budget, reach, and leads.');return;}
        const btn=document.getElementById('analyze-btn');
        document.getElementById('btn-spinner').style.display='block';
        document.getElementById('btn-text').textContent='Analyzing...';
        btn.disabled=true;

        const prompt=`Analyze this ${service} campaign data and return ONLY this JSON structure:
{"forecastedReach":number,"forecastedLeads":number,"forecastedConversions":number,"forecastedROAS":number,"growthRate":number,"insights":[{"type":"opportunity","text":"specific insight"},{"type":"forecast","text":"30 day expectation"},{"type":"warning","text":"risk or improvement"}]}
Data: budget $${budget}/mo, reach ${reach}, leads ${leads}, conversions ${conv}, deal value $${deal}, revenue $${conv*deal}, ROAS ${budget>0?((conv*deal)/budget).toFixed(2):'N/A'}.
Rules: forecastedReach 15-35% higher, forecastedLeads 10-30% higher, growthRate between 0.10-0.35, insights must be specific to this data.`;

        const data=await callAI(prompt);
        const safeLeads=leads||1;
        const fb={
            forecastedReach:Math.round(reach*1.22),forecastedLeads:Math.round(leads*1.18),
            forecastedConversions:Math.round(conv*1.15),
            forecastedROAS:budget>0?parseFloat(((conv*deal)/budget+0.4).toFixed(1)):0.4,
            growthRate:0.18,
            insights:[
                {type:'opportunity',text:'Increase ad frequency in the first 10 days to capture peak audience attention and improve reach significantly.'},
                {type:'forecast',text:`Based on current data, expect around ${Math.round(leads*1.18)} leads next month with consistent budget and targeting.`},
                {type:'warning',text:`Monitor cost per lead — if it rises above $${Math.round(budget/safeLeads*1.3)}, pause and optimize your audience targeting.`}
            ]
        };

        const result=data||fb;
        document.getElementById('empty-section').classList.add('hidden');
        document.getElementById('metrics-section').classList.remove('hidden');
        renderMetrics(buildMetrics(result));
        renderChart(result);
        renderInsights(result.insights);
        btn.disabled=false;
        document.getElementById('btn-spinner').style.display='none';
        document.getElementById('btn-text').textContent='Re-analyze →';
    }
</script>
</body>
</html>
